spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patient-service
              uri: lb://PATIENT-SERVICE
              predicates:
                - Path= /api/patients/**

            - id: consultation-service
              uri: lb://CONSULTATION-SERVICE
              predicates:
                - Path= /api/consultations/**

            - id: appointment-service
              uri: lb://APPOINTMENT-SERVICE
              predicates:
                - Path= /api/appointments/**

            - id: queue-service-appointment
              uri: lb://APPOINTMENT-SERVICE
              predicates:
                - Path= /api/queue/**

            - id: analytics-service
              uri: lb://ANALYTICS-SERVICE
              predicates:
                - Path= /api/statistics/**

            - id: billing-service
              uri: lb://BILLING-SERVICE
              predicates:
                - Path= /api/billing/**

            - id: chatbot-service
              uri: lb://CHATBOT-SERVICE
              predicates:
                - Path= /chatbot/**

            - id: clinic-service
              uri: lb://CLINIC-SERVICE
              predicates:
                - Path= /api/clinics/**

            - id: medical-record-service
              uri: lb://MEDICAL-RECORD-SERVICE
              predicates:
                - Path= /api/records/**

            - id: medication-service
              uri: lb://MEDICATION-SERVICE
              predicates:
                - Path= /api/medications/**

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path= /api/notifications/**

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path= /payments/**

            - id: prescription-service
              uri: lb://PRESCRIPTION-SERVICE
              predicates:
                - Path= /api/prescriptions/**

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path= /api/users/**
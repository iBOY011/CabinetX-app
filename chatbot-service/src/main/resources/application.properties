spring.application.name=chatbot-service
# Disable config server for local development
spring.cloud.config.enabled=false

# H2 Database for local development
spring.datasource.url=jdbc:h2:mem:chatbotdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Server port
server.port=8093

# Eureka client (disable for local)
eureka.client.enabled=false

# Feign clients (disable for local)
feign.client.enabled=false

spring.application.name=chatbot-service
spring.config.import=optional:configserver:
spring.cloud.config.uri=http://configuration-service:8888

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/
eureka.instance.prefer-ip-address=true


spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8079/realms/cabinetX-microservice-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8079/realms/cabinetX-microservice-realm/protocol/openid-connect/certs

spring.application.name=configuration-service
server.port=8888

# Config Server Git Repository Configuration
spring.cloud.config.server.git.uri=https://github.com/iBOY011/ConfigRepoCabinetX.git
spring.cloud.config.server.git.username=${CONFIG_GIT_USERNAME}
spring.cloud.config.server.git.password=${CONFIG_GIT_PASSWORD}
spring.cloud.config.server.git.default-label=master

# Eureka Client Configuration
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Management Endpoints
management.endpoints.web.exposure.include=*
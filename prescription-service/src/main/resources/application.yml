spring:
  application:
    name: prescription-service
  config:
    import: optional:configserver:http://localhost:8761
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  datasource:
    url: jdbc:h2:mem:prescriptiondb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  messages:
    basename: messages

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
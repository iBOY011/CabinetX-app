spring.application.name=prescription-service
spring.cloud.config.uri=http://localhost:8888
spring.cloud.config.fail-fast=true
spring.config.import=optional:configserver:
spring.kafka.bootstrap-servers=3.84.72.92:9092
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.gi.prescriptionservice.messaging.OrdonnanceCountRequest
spring.kafka.consumer.group-id=prescription-service

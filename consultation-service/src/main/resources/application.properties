spring.application.name=consultation-service
spring.cloud.config.uri=http://localhost:8888
spring.cloud.config.fail-fast=true
spring.config.import=optional:configserver:

# Kafka Configuration with memory limits
spring.kafka.bootstrap-servers=34.207.89.197:9092
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.gi.consultationservice.messaging.OrdonnanceCountResponse
spring.kafka.consumer.group-id=consultation-service
# Kafka memory limits to prevent OOM
spring.kafka.consumer.properties.max.partition.fetch.bytes=1048576
spring.kafka.consumer.properties.fetch.max.bytes=5242880
spring.kafka.consumer.properties.max.poll.records=100
spring.kafka.consumer.auto-offset-reset=latest
# Kafka connection timeouts
spring.kafka.consumer.properties.request.timeout.ms=30000
spring.kafka.consumer.properties.session.timeout.ms=10000
spring.kafka.consumer.properties.heartbeat.interval.ms=3000
# Enable Kafka listeners and auto-create topics
spring.kafka.listener.auto-startup=true
spring.kafka.admin.auto-create-topics=true

# JWT/Keycloak timeout configuration
spring.security.oauth2.resourceserver.jwt.jwk-set-cache-lifespan=86400s
spring.security.oauth2.resourceserver.jwt.jwk-set-cache-refresh-time=43200s
